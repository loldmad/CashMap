<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CashMap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>💰 CashMap</h1>
        <p>Your personal money map dashboard.</p>
      </header>

      <nav class="tab-nav" id="tabNav" role="tablist" aria-label="CashMap sections">
        <button type="button" class="tab-btn active" data-tab="overview" role="tab" aria-selected="true" aria-controls="overview" id="tab-overview">📊 Overview</button>
        <button type="button" class="tab-btn" data-tab="income" role="tab" aria-selected="false" aria-controls="income" id="tab-income">💼 Income Streams</button>
        <button type="button" class="tab-btn" data-tab="paycheck" role="tab" aria-selected="false" aria-controls="paycheck" id="tab-paycheck">💵 Paycheck Breakdown</button>
        <button type="button" class="tab-btn" data-tab="goals" role="tab" aria-selected="false" aria-controls="goals" id="tab-goals">🎯 Goals</button>
        <button type="button" class="tab-btn" data-tab="cashflow" role="tab" aria-selected="false" aria-controls="cashflow" id="tab-cashflow">📈 Cash Flow Map</button>
      </nav>

      <main>
        <section class="tab-panel active" id="overview" role="tabpanel" aria-labelledby="tab-overview" ></section>
        <section class="tab-panel" id="income" role="tabpanel" aria-labelledby="tab-income" hidden></section>
        <section class="tab-panel" id="paycheck" role="tabpanel" aria-labelledby="tab-paycheck" hidden></section>
        <section class="tab-panel" id="goals" role="tabpanel" aria-labelledby="tab-goals" hidden></section>
        <section class="tab-panel" id="cashflow" role="tabpanel" aria-labelledby="tab-cashflow" hidden></section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
